name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões que o GitHub Actions precisa para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; um push novo não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O Pages serve o site em /<nome-do-repositorio>/, então o build
      # precisa gerar os caminhos com esse prefixo.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
